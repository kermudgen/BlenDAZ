schema_version = "1.0.0"

id = "blendaz"
version = "1.0.0"
name = "BlenDAZ"
tagline = "Visual posing tools for DAZ Genesis 8/9 characters"
maintainer = "Joshua D Rother <josh@azra.ai>"
type = "add-on"

blender_version_min = "5.0.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Joshua D Rother"]

website = "https://github.com/jrother/BlenDAZ"

tags = ["Rigging", "Animation"]

# Filesystem: dsf_face_groups reads Genesis .dsf files from the DAZ content
# library (located via ~/Documents/DAZ Importer settings), and PoseBlend
# imports/exports grid JSON. No network, clipboard, camera or microphone.
[permissions]
files = "Read DAZ library .dsf files, import/export PoseBlend grids"
